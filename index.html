<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <title>合工大工科新生智能体</title>
    <meta name="description" content="合肥工业大学工科新生 AI 助教：高数A、电路分析、学长笔记、真题课件，免登录直接提问。" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; padding: 0; background: #ffffff; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }
      /* 官方 SDK 全屏挂载，其内部 iframe 自动铺满 */
      #sdk-root { position: fixed; inset: 0; width: 100%; height: 100%; }
      #sdk-root iframe { width: 100% !important; height: 100% !important; border: 0 !important; }

      /* 加载页：SDK 注入后自动移除 */
      #boot {
        position: fixed; inset: 0; z-index: 50;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #ffffff; color: #1a2033;
        transition: opacity .35s ease; padding: 24px; text-align: center;
      }
      #boot.hide { opacity: 0; pointer-events: none; }
      #boot .logo {
        width: 56px; height: 56px; border-radius: 16px;
        background: linear-gradient(135deg, #1e3a8a, #2563eb);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 26px; font-weight: 700;
        box-shadow: 0 8px 24px rgba(37, 99, 235, .28);
      }
      #boot h1 { font-size: 17px; font-weight: 600; margin: 4px 0 0; }
      #boot p { font-size: 13px; color: #6b7489; margin: 0; }
      .spin {
        width: 30px; height: 30px; margin-top: 6px;
        border: 3px solid #e4e8ef; border-top-color: #2563eb;
        border-radius: 50%; animation: sp .8s linear infinite;
      }
      @keyframes sp { to { transform: rotate(360deg); } }
      #retry { display: none; margin-top: 8px; }
      #retry button {
        border: 0; cursor: pointer; font-size: 14px; font-weight: 500;
        padding: 10px 22px; border-radius: 9px; color: #fff;
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <div id="sdk-root"></div>

    <div id="boot">
      <div class="logo" aria-hidden="true">工</div>
      <h1>合工大工科新生智能体</h1>
      <p>高数 A · 电路分析 · 学长笔记 · 真题课件</p>
      <div class="spin" id="spin"></div>
      <p id="btip">正在进入，稍等片刻…</p>
      <div id="retry"><button type="button" onclick="location.reload()">重新进入</button></div>
    </div>

    <script>

    <script>
      (function () {
        var PROJECT_ID = '7700992080180412479';
        var TOKEN = 'sat_REPLACE_WITH_YOUR_TOKEN';

        var boot = document.getElementById('boot');
        var spin = document.getElementById('spin');
        var btip = document.getElementById('btip');
        var retry = document.getElementById('retry');
        var hidden = false;
        function hideBoot() {
          if (hidden) return; hidden = true;
          boot.classList.add('hide');
          setTimeout(function () { boot.style.display = 'none'; }, 400);
        }
        function fail() {
          spin.style.display = 'none';
          btip.textContent = '进入失败，请检查网络后重试';
          retry.style.display = 'block';
        }

        function start() {
          try {
            window.cozeWebSDK.init({
              projectId: PROJECT_ID,
              token: TOKEN,
              container: '#sdk-root',
              onProjectInfoLoaded: hideBoot,
              onTokenInvalid: fail,
              onNetworkError: fail
            });
          } catch (e) { fail(); }
        }

        if (window.cozeWebSDK) {
          start();
        } else {
          // 官方脚本若被网络拦截，给出重试而不是一直转
          window.addEventListener('load', function () {
            if (!window.cozeWebSDK) fail();
          });
          var iv = setInterval(function () {
            if (window.cozeWebSDK) { clearInterval(iv); start(); }
          }, 60);
          setTimeout(function(){ if(!window.cozeWebSDK){clearInterval(iv);fail();} }, 8000);
        }

        // SDK 会动态创建 iframe；监听其插入并在真正 load 完成后收起启动页
        var rootEl = document.getElementById('sdk-root');
        function bindFrame(f) {
          if (!f || f.__bound) return; f.__bound = true;
          f.addEventListener('load', function () { setTimeout(hideBoot, 400); });
        }
        new MutationObserver(function () {
          bindFrame(rootEl.querySelector('iframe'));
        }).observe(rootEl, { childList: true, subtree: true });
        bindFrame(rootEl.querySelector('iframe'));
        // 最长 20 秒仍无 iframe，提示重试
        setTimeout(function () {
          if (!hidden && !rootEl.querySelector('iframe')) fail();
        }, 20000);
      })();
    </script>
  </body>
</html>
